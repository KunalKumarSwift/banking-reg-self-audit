[project]
name = "banking-reg-self-audit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.8.0",
    "google-cloud-aiplatform[adk,agent-engines]>=2.1.0",
    "google-cloud-discoveryengine>=0.20.3",
    "google-cloud-storage>=3.14.1",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_agent"]

[tool.pyright]
extraPaths = ["src"]